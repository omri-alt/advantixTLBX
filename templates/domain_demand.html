{% from "macros/page_header.html" import tool_header %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domain demand fill · KLblend</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='ui_shared.css') }}">
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --line: #27324a;
      --text: #eaf1fb;
      --muted: #9aa4b2;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, Arial, sans-serif; background: linear-gradient(180deg, #0b1020, #0d1426 35%, #0b1020); color: var(--text); }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .muted { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
    .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #17223a; color: var(--text); cursor: pointer; font: inherit; text-decoration: none; }
    .btn:hover { background: #1d2b47; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px 16px; margin-bottom: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .summary-card { border: 1px solid var(--line); border-radius: 12px; background: #151f33; padding: 12px 14px; }
    .summary-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .summary-card .val { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .err { margin-top: 10px; color: #fdba74; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: #cbd5e1; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .bc-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .bc-pill.green { background: rgba(34,197,94,.18); color: #4ade80; }
    .bc-pill.yellow { background: rgba(245,158,11,.18); color: #fcd34d; }
    .bc-pill.red { background: rgba(239,68,68,.18); color: #fca5a5; }
    .bc-pill.none { background: #334155; color: #cbd5e1; }
    .bc-bar { height: 8px; border-radius: 999px; background: #1e293b; overflow: hidden; min-width: 80px; }
    .bc-bar span { display: block; height: 100%; }
    .bc-bar span.green { background: #22c55e; }
    .bc-bar span.yellow { background: #f59e0b; }
    .bc-bar span.red { background: #ef4444; }
    .bc-bar span.none { background: #64748b; }
    .empty { color: var(--muted); padding: 16px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    {{ tool_header("Domain demand fill", "Hub campaign 94 · geo × device vs today’s demand bill", "domain-demand") }}
    <p style="margin:0 0 14px;"><a class="btn" href="{{ url_for('ui_home') }}">← Control Center</a></p>    <div class="actions">
      <button type="button" class="btn" id="refresh-btn">Refresh</button>
      <a class="btn" href="{{ url_for('ui_trillion_yesterday_review') }}">Yesterday review</a>
      <span class="muted" id="meta"></span>
    </div>
    <div class="panel">
      <div class="summary-grid" id="summary"></div>
      <div class="err" id="err" style="display:none;"></div>
    </div>
    <div class="panel" id="table-wrap">
      <div class="empty" id="body">Loading…</div>
    </div>
  </div>
  <script>
  (function() {
    var apiUrl = {{ url_for("api_domain_demand_progress") | tojson }};
    var refreshUrl = {{ url_for("api_domain_demand_progress_refresh") | tojson }};
    var metaEl = document.getElementById("meta");
    var summaryEl = document.getElementById("summary");
    var bodyEl = document.getElementById("body");
    var errEl = document.getElementById("err");
    var refreshBtn = document.getElementById("refresh-btn");

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
    function barWidth(pct) {
      if (pct == null || isNaN(pct)) return 0;
      return Math.max(0, Math.min(100, pct));
    }
    function card(label, val) {
      return '<div class="summary-card"><div class="label">' + esc(label) + '</div><div class="val">' + esc(val) + '</div></div>';
    }
    function paint(data) {
      var t = (data && data.totals && data.totals.hub) || {};
      var demand = t.demand_clicks != null ? t.demand_clicks : "—";
      var delivered = t.delivered_clicks != null ? t.delivered_clicks : "—";
      var pct = t.fill_pct != null ? t.fill_pct + "%" : "—";
      var updated = data.updated_at || data.cache_saved_utc || "—";
      summaryEl.innerHTML =
        card("Demand today", demand) +
        card("Supplied", delivered) +
        card("Fill", pct) +
        card("Under geos", ((data.under_geos || []).length)) +
        card("OK geos (≥90%)", ((data.ok_geos || []).length)) +
        card("Day", data.calendar_day || "—");
      metaEl.textContent =
        "Updated " + String(updated).replace("T", " ").replace("Z", " UTC") +
        (data.stale ? " · stale" : "") +
        (data.refresh_queued ? " · refresh queued" : "");
      var errs = (data && data.errors) || [];
      if (errs.length) {
        errEl.style.display = "block";
        errEl.textContent = errs.join(" · ");
      } else {
        errEl.style.display = "none";
        errEl.textContent = "";
      }
      if (data && data.status === "awaiting_daily") {
        bodyEl.className = "empty";
        bodyEl.textContent = data.message || "Awaiting morning domain-demand bill.";
        return;
      }
      var segs = ((data && data.segments) || []).filter(function(s) {
        return (s.demand_clicks || 0) > 0 || (s.delivered_clicks || 0) > 0;
      });
      if (!segs.length) {
        bodyEl.className = "empty";
        bodyEl.textContent = "No geo × device demand segments yet.";
        return;
      }
      var rows = segs.map(function(s) {
        var lvl = s.level || "none";
        var pct = s.fill_pct;
        var bw = barWidth(pct);
        return (
          "<tr>" +
          "<td>" + esc((s.geo || "").toUpperCase()) + "</td>" +
          "<td>" + esc(s.device || "") + "</td>" +
          '<td class="num">' + esc(s.demand_clicks) + "</td>" +
          '<td class="num">' + esc(s.delivered_clicks) + "</td>" +
          '<td class="num">' + esc(s.remaining) + "</td>" +
          '<td class="num">' + (pct != null ? esc(pct) + "%" : "—") + "</td>" +
          "<td><span class=\"bc-pill " + esc(lvl) + "\">" + esc(lvl) + "</span></td>" +
          "<td><div class=\"bc-bar\"><span class=\"" + esc(lvl) + "\" style=\"width:" + bw + "%\"></span></div></td>" +
          "<td>" + esc(s.trillion_status || "—") + "</td>" +
          "<td>" + esc(s.trillion_hint || "") + "</td>" +
          "</tr>"
        );
      }).join("");
      bodyEl.className = "";
      bodyEl.innerHTML =
        "<table><thead><tr>" +
        "<th>Geo</th><th>Device</th>" +
        '<th class="num">Demand</th><th class="num">Delivered</th><th class="num">Left</th><th class="num">Filled</th>' +
        "<th>Level</th><th>Progress</th><th>Trillion</th><th>Hint</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>";
    }
    function load() {
      return fetch(apiUrl, { credentials: "same-origin", headers: { Accept: "application/json" } })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(paint)
        .catch(function(e) {
          bodyEl.className = "empty";
          bodyEl.textContent = "Failed to load: " + (e && e.message ? e.message : String(e));
        });
    }
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function() {
        refreshBtn.disabled = true;
        metaEl.textContent = "Refreshing…";
        fetch(refreshUrl, {
          method: "POST",
          credentials: "same-origin",
          headers: { Accept: "application/json" },
        })
          .then(function(r) {
            if (!r.ok) {
              return r.json().catch(function() { return {}; }).then(function(j) {
                throw new Error(j.error || ("HTTP " + r.status));
              });
            }
            return r.json();
          })
          .then(paint)
          .catch(function(e) {
            errEl.style.display = "block";
            errEl.textContent = "Refresh failed: " + (e && e.message ? e.message : String(e));
            return load();
          })
          .finally(function() { refreshBtn.disabled = false; });
      });
    }
    load();
  })();
  </script>
</body>
</html>
